[package]
name = "tauri-plugin-udl-engine"
version = "0.1.0"
description = "Android download engine for U-Download: yt-dlp, ffmpeg and aria2c via youtubedl-android"
edition = "2021"
license = "MIT"
publish = false
# Required by tauri-build: it only discovers a plugin's Android library through
# the DEP_<links>_ANDROID_LIBRARY_PATH variable, and Cargo only sets that for
# crates that declare `links`.
links = "tauri-plugin-udl-engine"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
